version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # Majors with a code migration of their own; upgraded deliberately,
      # outside the weekly groups.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      # Moves together with the digest-pinned Playwright image in ci.yml.
      - dependency-name: "@playwright/test"
      # The 4.0.0 tag is a 2025 browser-only build that predates the 3.x line
      # and has no Node entry or server access key; 3.x is the current line.
      - dependency-name: "@cloudbase/js-sdk"
        versions: [">=4.0.0"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
