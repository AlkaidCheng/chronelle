name: Bug report
description: Report reproducible incorrect behavior.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private files, or personal travel data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
