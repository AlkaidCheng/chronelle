name: CI

on:
  workflow_call:
    inputs:
      retain_images:
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: chronelle
          POSTGRES_PASSWORD: chronelle_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronelle -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://chronelle:chronelle_dev@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Run quality gate
        run: pnpm check

  containers:
    name: containers
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: chronelle-api:validation
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Build web container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: chronelle-web:validation
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check runtime containers
        env:
          API_IMAGE: chronelle-api:validation
          WEB_IMAGE: chronelle-web:validation
          EXPECTED_REVISION: ${{ github.sha }}
        run: node infrastructure/scripts/check-containers.mjs
      - name: Save validated images
        if: inputs.retain_images
        run: docker save --output runtime-images.tar chronelle-api:validation chronelle-web:validation
      - name: Retain validated images
        if: inputs.retain_images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-images-${{ github.sha }}
          path: runtime-images.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  browser:
    name: browser
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chronelle
          POSTGRES_USER: chronelle
          POSTGRES_PASSWORD: chronelle_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronelle -d chronelle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://chronelle:chronelle_dev@localhost:5432/chronelle
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser release gate
        run: pnpm test:e2e
      - name: Check offline design sandbox
        run: pnpm test:sandbox
