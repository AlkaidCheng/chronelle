services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chronelle
      POSTGRES_USER: chronelle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the private preview}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "chronelle", "-d", "chronelle"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ${API_IMAGE:-livtales-api:local}
    healthcheck:
      disable: true
    command:
      - sh
      - -ec
      - node node_modules/@livtales/db/dist/cli.js && node node_modules/@livtales/object-model/dist/baseline-cli.js
    environment:
      DATABASE_URL: postgresql://chronelle:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/chronelle
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy

  runtime-role:
    image: postgres:17-alpine
    user: postgres
    entrypoint:
      [
        "psql",
        "-X",
        "--no-password",
        "--file",
        "/configuration/runtime-role.sql",
      ]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: chronelle
      PGUSER: chronelle
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?Set RUNTIME_DATABASE_PASSWORD}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./database/runtime-role.sql:/configuration/runtime-role.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: ${API_IMAGE:-livtales-api:local}
    environment:
      DATABASE_URL: postgresql://chronelle_runtime:${RUNTIME_DATABASE_PASSWORD:?Set RUNTIME_DATABASE_PASSWORD}@postgres:5432/chronelle
      ENABLE_DEVELOPMENT_AUTH: ${ENABLE_DEVELOPMENT_AUTH:-false}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    volumes:
      - documents:/app/.livtales/storage
    depends_on:
      runtime-role:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:-livtales-web:local}
    networks: [default, ingress]
    environment:
      API_INTERNAL_URL: http://api:4000
      WEB_DEVELOPMENT_SIGN_IN: ${ENABLE_DEVELOPMENT_AUTH:-false}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0700
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    internal: true
  ingress:

volumes:
  postgres-data:
  documents:
