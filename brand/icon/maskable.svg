<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<title>LivTales</title>
<!-- Maskable PWA icon. The Android adaptive background layer fills the canvas (its central
72 dp, so the 108 dp layer spans 150 units), and the foreground layer is scaled by 0.85 about
the centre so the mark and its shadow stay inside the central 80% circle (radius 40). -->
<svg x="-25" y="-25" width="150" height="150" viewBox="-25 -25 150 150">
<defs>
<linearGradient id="bg-sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
<stop offset="0" stop-color="#35B8EE"/>
<stop offset="0.34" stop-color="#2358D6"/>
<stop offset="0.7" stop-color="#1B3598"/>
<stop offset="1" stop-color="#13296F"/>
</linearGradient>
<radialGradient id="bg-glow" gradientUnits="userSpaceOnUse" cx="5" cy="2" r="60">
<stop offset="0" stop-color="#5EE6F5" stop-opacity="0.55"/>
<stop offset="1" stop-color="#5EE6F5" stop-opacity="0"/>
