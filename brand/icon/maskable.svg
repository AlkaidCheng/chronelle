<path d="M-30.4 58.4L-8 50C8 44 20 26 40 21S72 10 102 -2L126 -11.6" transform="translate(0 -3.5)" fill="none" stroke="url(#bg-aur)" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
<path d="M-30.4 58.4L-8 50C8 44 20 26 40 21S72 10 102 -2L126 -11.6" transform="translate(0 -7)" fill="none" stroke="url(#bg-aur)" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
<path d="M-30.4 58.4L-8 50C8 44 20 26 40 21S72 10 102 -2L126 -11.6" transform="translate(0 -10.5)" fill="none" stroke="url(#bg-aur)" stroke-width="9" stroke-linecap="round" opacity="0.38"/>
