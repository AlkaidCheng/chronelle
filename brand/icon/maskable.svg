<stop offset="0.5" stop-color="#C8FBFF" stop-opacity="0.902"/>
<stop offset="0.8" stop-color="#9AE8FF" stop-opacity="0.351"/>
<stop offset="1" stop-color="#9AE8FF" stop-opacity="0"/>
</linearGradient>
<filter id="bg-coreblur" filterUnits="userSpaceOnUse" x="-45" y="-45" width="190" height="190">
