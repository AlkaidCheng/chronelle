<path d="M-30.4 58.4L-8 50C8 44 20 26 40 21S72 10 102 -2L126 -11.6" transform="translate(0 -17.5)" fill="none" stroke="url(#bg-aur)" stroke-width="9" stroke-linecap="round" opacity="0.1"/>
</g>
