<path d="M46.75 66.12A44 44 0 0 0 16 57" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.4" clip-path="url(#fg-pageclip)"/>
</g>
</g>
</svg>
</g>
